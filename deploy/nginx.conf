server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 媒体文件内部重定向出口（FR-389）：只能由应用的 X-Accel-Redirect 头触发，
    # 外部直接访问返回 404。应用查库鉴权后只回一个头，传输交给 sendfile，
    # 省掉应用约 1.3 秒 CPU / GB 出流量，也不再让 372MB 的视频过一遍代理缓冲。
    location /__media/ {
        internal;
        alias /media/;

        sendfile       on;
        tcp_nopush     on;
        output_buffers 2 128k;

        # 1182 个 TTS 小文件反复命中，缓存打开的文件句柄省掉每次 open/stat
        open_file_cache          max=2000 inactive=120s;
        open_file_cache_valid    60s;
        open_file_cache_min_uses 1;
        open_file_cache_errors   on;

        access_log off;
    }

    location /api/ {
        proxy_pass http://api:8100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        # 应用侧的 SSE 与大响应都不该被缓冲：前者要实时逐块吐，
        # 后者会让 nginx 先落一份 proxy_temp 再转发
        proxy_buffering off;
        proxy_request_buffering off;
        # 上传书籍/录音走这条路，默认 1m 会直接 413
        client_max_body_size 512m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 缓存策略 ----
    # 入口 HTML 必须每次回源校验：它里面写着当前那批 hash 资产的文件名。
    # 原来两个 conf 都没设 Cache-Control，浏览器就按 Last-Modified 做启发式缓存，
    # 于是「镜像重建了、页面还是旧的」——拿到的是旧 HTML，它指向的自然还是旧资产。
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # 反过来，带内容 hash 的资产改一个字节文件名就变，可以放心长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
